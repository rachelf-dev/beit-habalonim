<div class="w-full max-w-md relative">
<!-- Ambient Celebration Subtle Backlights -->
<div class="absolute -top-12 -right-12 w-48 h-48 bg-primary/10 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute -bottom-10 -left-10 w-44 h-44 bg-secondary-fixed/30 rounded-full blur-2xl pointer-events-none"></div>
<!-- Login Boutique Card -->
<div class="relative bg-surface-container-lowest shadow-xl rounded-xl p-8 md:p-10 flex flex-col items-center">
<!-- Boutique Logo & Monogram Accent -->
<div class="relative mb-6 flex items-center justify-center">
<div class="w-20 h-20 rounded-full bg-surface-container-low flex items-center justify-center shadow-sm">
<svg class="w-11 h-11 text-primary" fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<!-- Balloon 1: Foil Heart Silhouette -->
<path d="M20.5 8C17 8 14 10.5 14 14C14 18.5 20.5 24 20.5 24C20.5 24 27 18.5 27 14C27 10.5 24 8 20.5 8Z" fill="currentColor" fill-opacity="0.85"></path>
<!-- Balloon 2: Metallic Oval Silhouette Overlap -->
<ellipse cx="27.5" cy="18.5" fill="#7D562D" fill-opacity="0.75" rx="8.5" ry="11.5"></ellipse>
<!-- Ribbons Streamers -->
<path d="M20.5 24C20 28 22 31 18 36M27.5 30C29 33 27 36 29 40" stroke="#7D562D" stroke-linecap="round" stroke-width="1.5"></path>
<!-- Highlight Sparkle -->
<circle cx="18" cy="12" fill="#FFFFFF" r="1.5"></circle>
<circle cx="25" cy="14" fill="#FFFFFF" r="1.5"></circle>
</svg>
</div>
<span class="absolute -top-1 -right-1 flex h-4 w-4">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary-container opacity-75"></span>
<span class="relative inline-flex rounded-full h-4 w-4 bg-primary text-[9px] text-on-primary items-center justify-center font-bold">★</span>
</span>
</div>
<!-- Header Typography -->
<div class="text-center w-full mb-8">
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container-low text-secondary font-label-sm text-label-sm mb-3">
<span class="material-symbols-outlined text-sm">lock</span>
<span>פורטל ניהול מאובטח</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface tracking-tight mb-2">
          כניסה למערכת ניהול - בית הבלונים
        </h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">
          גישה מורשית למנהלת החנות בלבד
        </p>
</div>
<!-- Authentication Form -->
<form class="w-full flex flex-col gap-5" id="admin-login-form" onsubmit="event.preventDefault(); handleLogin();">
<!-- Email Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface flex items-center justify-between" for="admin-email">
<span>כתובת אימייל</span>
<span class="text-on-surface-variant text-xs">שם משתמש ראשי</span>
</label>
<div class="relative flex items-center">
<input autocomplete="username" class="w-full h-12 bg-surface-container-low text-on-surface placeholder:text-outline text-left px-4 rounded-lg outline-none transition-all duration-200 focus:bg-surface-container-lowest focus:shadow-[0_0_0_2px_#c93f5b]" dir="ltr" id="admin-email" name="email" placeholder="admin@beithabalonim.co.il" required="" type="email"/>
<span class="absolute right-3.5 text-on-surface-variant pointer-events-none material-symbols-outlined text-xl">
              mail
            </span>
</div>
</div>
<!-- Password Field with Toggle -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface flex items-center justify-between" for="admin-password">
<span>סיסמת כניסה</span>
<span class="text-on-surface-variant text-xs font-mono">256-bit</span>
</label>
<div class="relative flex items-center">
<input autocomplete="current-password" class="w-full h-12 bg-surface-container-low text-on-surface placeholder:text-outline text-left px-4 pr-11 rounded-lg outline-none transition-all duration-200 focus:bg-surface-container-lowest focus:shadow-[0_0_0_2px_#c93f5b]" dir="ltr" id="admin-password" name="password" placeholder="••••••••••••" required="" type="password"/>
<button aria-label="הצג או הסתר סיסמה" class="absolute right-2.5 h-8 w-8 rounded flex items-center justify-center text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-colors" id="toggle-password" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-xl" id="pwd-icon">
                visibility
              </span>
</button>
</div>
</div>
<!-- Security Guard Badge / Notice -->
<div class="flex items-start gap-2.5 p-3 rounded-lg bg-surface-container-low text-on-surface">
<span class="material-symbols-outlined text-tertiary text-lg shrink-0 mt-0.5">
            verified_user
          </span>
<p class="font-label-sm text-label-sm leading-relaxed text-on-surface-variant">
            הגנה מפני ניסיונות כושלים מופעלת (חסימה זמנית לאחר 5 ניסיונות)
          </p>
</div>
<!-- Primary Action Button -->
<button class="w-full h-12 mt-2 bg-primary-container hover:bg-primary text-on-primary font-label-lg text-label-lg rounded-lg shadow-md hover:shadow-lg active:scale-[0.99] transition-all flex items-center justify-center gap-2 cursor-pointer" id="submit-btn" type="submit">
<span>התחברות למערכת</span>
<span class="material-symbols-outlined text-lg scale-x-[-1]">
            arrow_forward
          </span>
</button>
</form>
<!-- System Telemetry Footer Tag -->
<div class="mt-8 pt-6 w-full flex items-center justify-between text-on-surface-variant font-label-sm text-label-sm">
<span class="flex items-center gap-1.5">
<span class="h-2 w-2 rounded-full bg-emerald-500 inline-block"></span>
          שרת תפעול פעיל
        </span>
<span class="font-mono text-xs opacity-75">גרסה 3.4.1</span>
</div>
</div>
<!-- Micro Brand Credit Line -->
<p class="text-center mt-6 text-on-surface-variant font-body-sm text-body-sm opacity-70">
      בלוני איכות, מארזי שוקולד ועיצובים חגיגיים • קונסיירז׳ מתנות
    </p>
</div>
</div>
<script>
  function togglePasswordVisibility() {
    var passwordInput = document.getElementById('admin-password');
    var icon = document.getElementById('pwd-icon');
    if (!passwordInput || !icon) return;

    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      passwordInput.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function handleLogin() {
    var btn = document.getElementById('submit-btn');
    if (!btn) return;
    
    var originalHTML = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-lg">progress_activity</span><span>מאמת נתונים...</span>';
    
    setTimeout(function() {
      btn.innerHTML = originalHTML;
      btn.disabled = false;
    }, 1200);
  }
</script></main></body></html>
